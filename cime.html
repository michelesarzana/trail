<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<link rel="icon" type="image/x-icon" href="/favicon.ico">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Cime — Every Single Trail</title>
<meta name="description" content="Tutte le cime censite. Mappa interattiva e griglia con dettagli.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<style>
/* ===== RESET & BASE ===== */
*, *::before, *::after { box-sizing: border-box; }
body { margin: 0; background: #faf7f4; font-family: 'Manrope', sans-serif; color: #2e2b38; }
a { color: #38324a; text-decoration: none; }
a:hover { color: #c17b8c; }
button { font-family: 'Manrope', sans-serif; cursor: pointer; border: none; }

/* ===== CSS VARS ===== */
:root {
  --accent: #c17b8c;
  --dark: #2e2b38;
  --muted: #726e7a;
  --bg: #faf7f4;
  --border: rgba(46,43,56,0.09);
}

/* ===== NAV ===== */
.nav {
  display: flex; align-items: center; justify-content: space-between;
  padding: 16px 48px; background: #fff;
  border-bottom: 1px solid rgba(46,43,56,0.08);
  position: sticky; top: 0; z-index: 1000; gap: 16px;
}
.nav-wordmark-wrap {
  display: inline-flex; flex-direction: row; align-items: center;
  gap: 10px; text-decoration: none; flex-shrink: 0;
}
.nav-logo { width: 38px; height: 38px; border-radius: 50%; object-fit: cover; flex-shrink: 0; }
.nav-wordmark-text { display: flex; flex-direction: column; align-items: flex-start; gap: 1px; }
.nav-wordmark { font-size: 20px; font-weight: 800; color: #2e2b38; letter-spacing: -0.01em; white-space: nowrap; line-height: 1.1; }
.nav-wordmark:hover { color: #2e2b38; }
.nav-payoff { font-family: 'Instrument Serif', serif; font-style: italic; font-size: 13px; color: #c17b8c; opacity: 0.85; white-space: nowrap; line-height: 1.2; }
.nav-tabs { display: flex; gap: 4px; background: rgba(46,43,56,0.05); border-radius: 10px; padding: 4px; }
.nav-tab { padding: 7px 18px; border-radius: 8px; font-size: 13px; font-weight: 700; color: #726e7a; transition: background .2s, color .2s; white-space: nowrap; }
.nav-tab:hover, .nav-tab.active { background: #fff; color: #2e2b38; box-shadow: 0 1px 4px rgba(46,43,56,0.10); }
.nav-right { display: flex; align-items: center; gap: 14px; }
.nav-counter { font-size: 13px; font-weight: 700; color: #726e7a; }
.nav-counter span { color: #2e2b38; }
.nav-add { background: #c17b8c; color: #fff; padding: 7px 14px; border-radius: 8px; font-size: 13px; font-weight: 700; transition: background .2s; }
.nav-add:hover { background: #a85f72; color: #fff; }

/* ===== QUOTA HERO ===== */
.quota-hero {
  background: linear-gradient(135deg, #2e2b38 0%, #3d3850 100%);
  color: #fff;
  padding: 32px 24px;
  text-align: center;
}
.quota-total { display: inline-flex; flex-direction: column; align-items: center; }
.quota-num {
  display: block;
  font-size: 56px;
  font-weight: 900;
  letter-spacing: -2px;
  color: #c17b8c;
  line-height: 1;
}
.quota-label {
  font-size: 16px;
  color: rgba(255,255,255,0.7);
  margin-top: 4px;
  display: block;
}

/* ===== COMPARISONS ===== */
.comparisons-section {
  background: #f8f6f9;
  padding: 24px;
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
  gap: 12px;
}
.cmp-card {
  background: #fff;
  border-radius: 14px;
  padding: 16px 18px;
  border: 1px solid rgba(46,43,56,0.08);
  display: flex;
  align-items: flex-start;
  gap: 14px;
}
.cmp-icon { font-size: 32px; flex-shrink: 0; line-height: 1; }
.cmp-body { flex: 1; min-width: 0; }
.cmp-title { font-weight: 700; font-size: 14px; color: #2e2b38; margin-bottom: 2px; }
.cmp-value { font-size: 22px; font-weight: 900; color: #c17b8c; line-height: 1.1; }
.cmp-sub { font-size: 12px; color: #726e7a; margin-top: 4px; }
.cmp-bar-wrap { margin-top: 8px; background: #f0edf0; border-radius: 4px; height: 6px; overflow: hidden; }
.cmp-bar { height: 6px; border-radius: 4px; background: #c17b8c; transition: width 0.8s cubic-bezier(.4,0,.2,1); }

/* ===== FILTERS BAR ===== */
.filters-bar {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 16px;
  padding: 16px 24px;
  background: #fff;
  border-bottom: 1px solid rgba(46,43,56,0.08);
}
.filters-bar .search-input {
  flex: 1;
  min-width: 200px;
  height: 40px;
  border: 1.5px solid rgba(46,43,56,0.12);
  border-radius: 10px;
  padding: 0 14px;
  font-size: 14px;
  font-family: 'Manrope', sans-serif;
  font-weight: 500;
  color: #2e2b38;
  outline: none;
  transition: border-color .2s, box-shadow .2s;
}
.filters-bar .search-input:focus { border-color: #c17b8c; box-shadow: 0 4px 24px rgba(193,123,140,0.18); background: #fff; }
.filters-bar .search-input::placeholder { color: #b0a8b5; }
.filter-group { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.filter-group label { font-size: 13px; color: #726e7a; font-weight: 600; white-space: nowrap; }
input[type=range] { width: 140px; accent-color: #c17b8c; cursor: pointer; }
.rpill {
  padding: 5px 12px;
  border-radius: 8px;
  font-size: 12px;
  cursor: pointer;
  background: rgba(46,43,56,0.06);
  color: #726e7a;
  font-weight: 600;
  border: none;
  transition: all .15s;
}
.rpill.active { background: #c17b8c; color: #fff; }
.rpill:hover:not(.active) { background: rgba(46,43,56,0.12); }

/* ===== MAP ===== */
.map-container {
  height: 420px; width: 100%;
  border-bottom: 1px solid rgba(46,43,56,0.08);
}
#peaks-map { height: 100%; width: 100%; }

/* ===== GRID ===== */
.peaks-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
  gap: 20px;
  padding: 32px 48px;
  max-width: 1400px;
  margin: 0 auto;
}
.peak-card {
  background: #fff; border-radius: 14px;
  border: 1.5px solid rgba(46,43,56,0.07);
  box-shadow: 0 2px 8px rgba(46,43,56,0.06);
  overflow: hidden; cursor: pointer;
  transition: border-color .2s, box-shadow .2s, transform .2s;
}
.peak-card:hover {
  border-color: #c17b8c;
  box-shadow: 0 4px 18px rgba(193,123,140,0.18);
  transform: translateY(-2px);
}
.peak-card-photo { width: 100%; height: 140px; object-fit: cover; display: block; }
.peak-card-photo-placeholder {
  width: 100%; height: 140px; display: flex; align-items: center; justify-content: center;
  font-size: 48px; background: linear-gradient(135deg, #f0edf5 0%, #e8e2f0 100%);
}
.peak-card-body { padding: 14px 16px; }
.peak-card-name { font-size: 15px; font-weight: 800; color: #2e2b38; margin-bottom: 6px; line-height: 1.2; }
.peak-alt { font-size: 20px; font-weight: 900; color: #c17b8c; }
.peak-alt-label { font-size: 12px; color: #726e7a; font-weight: 600; }
.peak-stars { color: #fdc400; font-size: 14px; margin-top: 4px; }
.peak-coords { font-size: 11px; color: #b0a8b5; margin-top: 4px; font-family: monospace; }
.peak-maps-link, .peak-trail-link {
  display: inline-block; padding: 4px 10px; border-radius: 6px;
  font-size: 11px; font-weight: 700; text-decoration: none; transition: opacity .2s;
}
.peak-maps-link { background: rgba(0,122,255,0.08); color: #007aff; }
.peak-maps-link:hover { opacity: 0.75; color: #007aff; }
.peak-trail-link { background: rgba(193,123,140,0.10); color: #c17b8c; }
.peak-trail-link:hover { opacity: 0.75; color: #c17b8c; }
.no-results { grid-column: 1/-1; text-align: center; padding: 60px 20px; color: #726e7a; }
.no-results-icon { font-size: 48px; margin-bottom: 12px; }

/* ===== FOOTER ===== */
.footer {
  text-align: center; padding: 32px 24px; font-size: 13px; color: #a0a0a0;
  border-top: 1px solid rgba(46,43,56,0.07); margin-top: 16px;
}
.footer a { color: #c17b8c; }

/* ===== PAGE HEADER ===== */
.page-header { padding: 40px 48px 24px; }
.page-header-title { font-size: 32px; font-weight: 900; margin: 0 0 6px; letter-spacing: -0.02em; }
.page-header-sub { margin: 0; font-size: 14px; color: #726e7a; font-weight: 600; }

@media (max-width: 768px) {
  .nav { padding: 12px 16px; }
  .nav-tabs { display: none; }
  .peaks-grid { padding: 20px 16px; gap: 14px; }
  .quota-num { font-size: 40px; }
  .comparisons-section { padding: 16px; }
  .filters-bar { padding: 12px 16px; }
  input[type=range] { width: 100px; }
}
</style>
</head>
<body>

<nav class="nav">
  <a href="index.html" class="nav-wordmark-wrap">
    <img src="https://raw.githubusercontent.com/michelesarzana/trail/main/media/logo.jpg" class="nav-logo" alt="EST logo">
    <div class="nav-wordmark-text">
      <span class="nav-wordmark">Every Single Trail</span>
      <span class="nav-payoff">No map is ever finished.</span>
    </div>
  </a>
  <div class="nav-tabs">
    <a href="index.html" class="nav-tab" data-tab="mappa">🗺️ Mappa</a>
    <a href="percorsi.html" class="nav-tab" data-tab="percorsi">🥾 Percorsi</a>
    <a href="cime.html" class="nav-tab active" data-tab="cime">🏔️ Cime</a>
  </div>
  <div class="nav-right">
    <span class="nav-counter"><span id="count-peaks">0</span> cime</span>
    <a href="admin/index.html" class="nav-add">+ ⛰️</a>
  </div>
</nav>

<div class="page-wrapper">

  <!-- SEZIONE STATS IN CIMA -->
  <div class="quota-hero">
    <div class="quota-total">
      <span class="quota-num" id="quota-total-num">—</span>
      <span class="quota-label">m di quota totale</span>
    </div>
  </div>

  <!-- CONFRONTI COSMICI -->
  <div class="comparisons-section" id="comparisons-section"></div>

  <!-- FILTRI E RICERCA -->
  <div class="filters-bar">
    <input type="search" id="search-input" class="search-input" placeholder="Cerca cima…" autocomplete="off" oninput="onSearch(this.value)">
    <div class="filter-group">
      <label>Altezza min: <span id="alt-val">0</span> m</label>
      <input type="range" id="alt-filter" min="0" max="4000" step="100" value="0" oninput="onAltChange(this.value)">
    </div>
    <div class="filter-group rating-pills" id="rating-pills">
      <span class="rpill active" data-val="0" onclick="onRatingFilter(0,this)">⭐ Tutti</span>
      <span class="rpill" data-val="3" onclick="onRatingFilter(3,this)">3+</span>
      <span class="rpill" data-val="4" onclick="onRatingFilter(4,this)">4+</span>
      <span class="rpill" data-val="5" onclick="onRatingFilter(5,this)">5</span>
    </div>
    <span class="results-label" id="results-sub">Caricamento…</span>
  </div>

  <!-- MAPPA -->
  <div class="map-container">
    <div id="peaks-map"></div>
  </div>

  <!-- GRIGLIA -->
  <div class="peaks-grid" id="peaks-grid"></div>

</div>

<footer class="footer">
  Every Single Trail &nbsp;·&nbsp; <a href="index.html">Torna alla mappa</a>
</footer>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
var PEAKS_URL = 'https://raw.githubusercontent.com/michelesarzana/trail/main/data/peaks.json';

var allPeaks = [];
var filterQ = '';
var filterAlt = 0;
var filterRating = 0;
var peaksMap = null;
var peakMarkers = {};

/* ===== UTILS ===== */
function escHtml(str) {
  return String(str).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

function starsHtml(n) {
  if (!n) return '';
  var s = '';
  for (var i = 0; i < n; i++) s += '★';
  return s;
}

/* ===== COMPARISONS ===== */
var COMPARISONS = [
  {
    id: 'everest', icon: '🏔️', title: 'Monte Everest',
    dist: 8849, hasBar: true,
    sub: function(tot, pct) {
      if (pct >= 100) return '✅ Hai superato il tetto del mondo!';
      return 'Al ' + pct.toFixed(1) + '% della vetta più alta della Terra';
    }
  },
  {
    id: 'marianne', icon: '🌊', title: 'Fossa delle Marianne',
    dist: 11034, hasBar: true,
    sub: function(tot, pct) {
      if (pct >= 100) return '✅ Più profondo dell\'oceano più profondo!';
      return 'Al ' + pct.toFixed(1) + '% del punto più basso degli oceani';
    }
  },
  {
    id: 'iss', icon: '🛸', title: 'Orbita ISS',
    dist: 408000, hasBar: true,
    sub: function(tot, pct) {
      return 'Al ' + pct.toFixed(2) + '% dell\'orbita della Stazione Spaziale';
    }
  },
  {
    id: 'burj', icon: '🏙️', title: 'Burj Khalifa',
    dist: 828, hasBar: false,
    sub: function(tot) {
      var n = Math.floor(tot / 828);
      var rem = (tot % 828).toFixed(0);
      return n + ' Burj Khalifa impilati + ' + rem + ' m';
    }
  },
  {
    id: 'troposfera', icon: '☁️', title: 'Troposfera',
    dist: 12000, hasBar: true,
    sub: function(tot, pct) {
      return 'Al ' + pct.toFixed(1) + '% dello spessore della troposfera';
    }
  },
  {
    id: 'mauna', icon: '🌋', title: 'Mauna Kea (dalla base)',
    dist: 10203, hasBar: true,
    sub: function(tot, pct) {
      if (pct >= 100) return '✅ Più alto della montagna più alta misurata dalla base!';
      return 'Al ' + pct.toFixed(1) + '% del Mauna Kea (base oceanica)';
    }
  },
  {
    id: 'luna', icon: '🌕', title: 'Distanza Terra–Luna',
    dist: 384400000, hasBar: false,
    sub: function(tot) {
      var rem = (384400000 - tot).toLocaleString('it-IT');
      var pct = (tot / 384400000 * 100).toExponential(2);
      return 'Ancora ' + rem + ' m… ci vorrà ancora un po\' (sei al ' + pct + '%)';
    }
  },
  {
    id: 'sole', icon: '☀️', title: 'Distanza Terra–Sole',
    dist: 149597870000, hasBar: false,
    sub: function(tot) {
      var trips = Math.round(149597870000 / tot);
      return 'Dovresti salire ancora ' + trips.toLocaleString('it-IT') + ' volte questa quota per arrivare al Sole';
    }
  },
  {
    id: 'alpha', icon: '⭐', title: 'Alpha Centauri',
    dist: 4.13e16, hasBar: false,
    sub: function(tot) {
      var years = Math.round(4.13e16 / tot / 365.25);
      return 'Salendo ogni giorno, ci vorresti ' + years.toLocaleString('it-IT') + ' anni';
    }
  }
];

function buildComparisons(totalM) {
  var el = document.getElementById('comparisons-section');
  if (!el) return;
  var html = '';
  for (var i = 0; i < COMPARISONS.length; i++) {
    var c = COMPARISONS[i];
    var pct = Math.min(100, (totalM / c.dist) * 100);
    var valDisplay;
    if (c.hasBar) {
      valDisplay = pct.toFixed(1) + '%';
    } else {
      if (c.dist >= 1e12) valDisplay = (totalM / c.dist).toExponential(2) + 'x';
      else if (c.dist >= 1e6) valDisplay = (totalM / c.dist * 100).toFixed(4) + '%';
      else valDisplay = Math.floor(totalM / c.dist) + 'x';
    }
    var subText = c.sub(totalM, pct);
    html += '<div class="cmp-card">';
    html += '<div class="cmp-icon">' + c.icon + '</div>';
    html += '<div class="cmp-body">';
    html += '<div class="cmp-title">' + escHtml(c.title) + '</div>';
    html += '<div class="cmp-value">' + valDisplay + '</div>';
    html += '<div class="cmp-sub">' + subText + '</div>';
    if (c.hasBar) {
      html += '<div class="cmp-bar-wrap"><div class="cmp-bar" style="width:' + pct.toFixed(2) + '%"></div></div>';
    }
    html += '</div></div>';
  }
  el.innerHTML = html;
}

/* ===== MAP ===== */
function initMap(peaks) {
  peaksMap = L.map('peaks-map').setView([45.5, 11.5], 7);
  L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
    attribution: '&copy; <a href="https://www.openstreetmap.org/">OpenStreetMap</a>',
    maxZoom: 18
  }).addTo(peaksMap);

  var bounds = [];
  peaks.forEach(function(p) {
    if (!p.lat || !p.lon) return;

    var icon = L.divIcon({
      html: '<div style="font-size:24px;line-height:1;filter:drop-shadow(0 1px 3px rgba(0,0,0,0.4))">🏔️</div>',
      className: '',
      iconAnchor: [12, 12]
    });

    var marker = L.marker([p.lat, p.lon], { icon: icon });

    var popupParts = ['<div style="min-width:160px;font-family:Manrope,sans-serif">'];
    if (p.photo) {
      popupParts.push('<img src="' + escHtml(p.photo) + '" style="width:100%;height:110px;object-fit:cover;border-radius:8px;margin-bottom:8px">');
    }
    popupParts.push('<strong style="font-size:14px;color:#2e2b38">' + escHtml(p.name || '') + '</strong>');
    if (p.altitude) {
      popupParts.push('<div style="font-size:13px;color:#726e7a;margin-top:2px">⛰ ' + p.altitude + ' m s.l.m.</div>');
    }
    if (p.rating) {
      popupParts.push('<div style="font-size:13px;color:#fdc400;margin-top:2px">' + starsHtml(p.rating) + '</div>');
    }
    if (p.lat && p.lon) {
      var mapsUrl = 'https://www.google.com/maps?q=' + p.lat + ',' + p.lon;
      popupParts.push('<a href="' + mapsUrl + '" target="_blank" style="display:inline-block;margin-top:8px;font-size:12px;font-weight:700;color:#007aff;text-decoration:none">🔗 Apri in Maps</a>');
    }
    popupParts.push('</div>');
    marker.bindPopup(popupParts.join(''), { maxWidth: 220, minWidth: 180 });

    marker.addTo(peaksMap);
    peakMarkers[p.id] = marker;
    bounds.push([p.lat, p.lon]);
  });

  if (bounds.length === 1) {
    peaksMap.setView(bounds[0], 11);
  } else if (bounds.length > 1) {
    peaksMap.fitBounds(bounds, { padding: [40, 40], maxZoom: 12 });
  }
}

function focusPeak(id) {
  var m = peakMarkers[id];
  if (m && peaksMap) {
    peaksMap.setView(m.getLatLng(), 12);
    m.openPopup();
    window.scrollTo({ top: 0, behavior: 'smooth' });
  }
}

function updateMapMarkers(filtered) {
  var filteredIds = {};
  filtered.forEach(function(p) { filteredIds[p.id] = true; });
  Object.keys(peakMarkers).forEach(function(id) {
    var marker = peakMarkers[id];
    if (filteredIds[id]) {
      if (!peaksMap.hasLayer(marker)) marker.addTo(peaksMap);
    } else {
      if (peaksMap.hasLayer(marker)) peaksMap.removeLayer(marker);
    }
  });
}

/* ===== FILTERS ===== */
function onSearch(val) {
  filterQ = val.trim().toLowerCase();
  applyFilters();
}

function onAltChange(val) {
  filterAlt = parseInt(val, 10) || 0;
  document.getElementById('alt-val').textContent = filterAlt;
  applyFilters();
}

function onRatingFilter(val, el) {
  filterRating = parseInt(val, 10) || 0;
  var pills = document.querySelectorAll('.rpill');
  pills.forEach(function(p) { p.classList.remove('active'); });
  if (el) el.classList.add('active');
  applyFilters();
}

function applyFilters() {
  var filtered = allPeaks.filter(function(p) {
    if (filterQ && !(p.name || '').toLowerCase().includes(filterQ)) return false;
    if (filterAlt > 0 && (p.altitude || 0) < filterAlt) return false;
    if (filterRating > 0 && (p.rating || 0) < filterRating) return false;
    return true;
  });
  renderGrid(filtered);
  updateMapMarkers(filtered);
}

/* ===== GRID ===== */
function renderGrid(list) {
  if (!list) list = allPeaks;
  var grid = document.getElementById('peaks-grid');
  var sub = document.getElementById('results-sub');

  var n = list.length;
  if (sub) sub.textContent = n + ' cim' + (n === 1 ? 'a' : 'e');

  if (!n) {
    grid.innerHTML = '<div class="no-results"><div class="no-results-icon">🔍</div><p>Nessuna cima trovata.</p></div>';
    return;
  }

  grid.innerHTML = list.map(function(p) {
    var starStr = starsHtml(p.rating);
    var mapsUrl = (p.lat && p.lon) ? 'https://www.google.com/maps?q=' + p.lat + ',' + p.lon : '';
    var coordStr = (p.lat && p.lon) ? p.lat.toFixed(4) + ', ' + p.lon.toFixed(4) : '';
    var trailHref = p.trail_id ? 'trails/' + p.trail_id + '/' : '';

    var photoHtml = p.photo
      ? '<img class="peak-card-photo" src="' + escHtml(p.photo) + '" alt="' + escHtml(p.name) + '" loading="lazy">'
      : '<div class="peak-card-photo-placeholder">🏔️</div>';

    var html = '<div class="peak-card" onclick="focusPeak(\'' + escHtml(p.id) + '\')">';
    html += photoHtml;
    html += '<div class="peak-card-body">';
    html += '<div class="peak-card-name">' + escHtml(p.name || '') + '</div>';
    if (p.altitude) {
      html += '<div><span class="peak-alt">' + p.altitude + '</span> <span class="peak-alt-label">m s.l.m.</span></div>';
    }
    if (starStr) html += '<div class="peak-stars">' + starStr + '</div>';
    if (coordStr) html += '<div class="peak-coords">' + coordStr + '</div>';
    html += '<div style="display:flex;flex-wrap:wrap;gap:6px;margin-top:8px">';
    if (mapsUrl) {
      html += '<a class="peak-maps-link" href="' + mapsUrl + '" target="_blank" onclick="event.stopPropagation()">🔗 Apri in Maps</a>';
    }
    if (trailHref) {
      html += '<a class="peak-trail-link" href="' + escHtml(trailHref) + '" onclick="event.stopPropagation()">🥾 Trail</a>';
    }
    html += '</div>';
    html += '</div></div>';
    return html;
  }).join('');
}

/* ===== INIT ===== */
async function init() {
  try {
    var r = await fetch(PEAKS_URL);
    var data = await r.json();
    allPeaks = data.peaks || (Array.isArray(data) ? data : []);
  } catch(e) {
    allPeaks = [];
    console.error('Failed to load peaks:', e);
  }

  // Totale quota
  var totalM = allPeaks.reduce(function(sum, p) { return sum + (p.altitude || 0); }, 0);
  var quotaEl = document.getElementById('quota-total-num');
  if (quotaEl) quotaEl.textContent = totalM.toLocaleString('it-IT');

  document.getElementById('count-peaks').textContent = allPeaks.length;

  // Aggiorna max slider altezza
  var maxAlt = allPeaks.reduce(function(m, p) { return Math.max(m, p.altitude || 0); }, 0);
  var slider = document.getElementById('alt-filter');
  if (slider) { slider.max = Math.ceil(maxAlt / 100) * 100; }

  buildComparisons(totalM);
  initMap(allPeaks);
  renderGrid(allPeaks);

  var sub = document.getElementById('results-sub');
  if (sub) sub.textContent = allPeaks.length + ' cime registrate · ' + totalM.toLocaleString('it-IT') + ' m totali';
}

document.addEventListener('DOMContentLoaded', function() { init(); });
</script>
